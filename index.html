<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunga Indah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a1a 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            color: white;
        }
        canvas {
            border-radius: 16px;
            box-shadow: 0 0 60px rgba(255, 105, 180, 0.4);
            max-width: 95vw;
            max-height: 95vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }
        .info h1 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #ff69b4;
        }
        .info p {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>
    <div class="info">
        <h1>Bunga Indah</h1>
        <p>Geser layar untuk ubah warna</p>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            const size = Math.min(window.innerWidth, window.innerHeight) * 0.88;
            canvas.width = size;
            canvas.height = size;
        }
        resize();
        window.addEventListener('resize', resize);

        let mouseX = 0.5;
        let mouseY = 0.5;
        let bloom = 0;

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = (touch.clientX - rect.left) / canvas.width;
            mouseY = (touch.clientY - rect.top) / canvas.height;
        }, { passive: false });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) / canvas.width;
            mouseY = (e.clientY - rect.top) / canvas.height;
        });

        function getPetalColor(layer, t) {
            const hue = (mouseX * 360 + layer * 35) % 360;
            const sat = 65 + mouseY * 25;
            return `hsl(${hue}, ${sat}%, 58%)`;
        }

        function drawLeaf(x, y, rotation, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.fillStyle = '#3a7a3a';
            ctx.beginPath();
            ctx.ellipse(0, 0, size * 0.35, size, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawPetal(cx, cy, angle, layer, progress, layerIndex) {
            const w = canvas.width;
            const r = w * layer.radius * progress;
            const petalWidth = w * layer.width * progress;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            const gradient = ctx.createLinearGradient(0, 0, 0, -r);
            gradient.addColorStop(0, getPetalColor(layerIndex, 0));
            gradient.addColorStop(1, 'rgba(255,255,255,0.15)');

            ctx.fillStyle = gradient;
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 1.2;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(
                petalWidth * 0.55, -r * 0.35,
                petalWidth * 0.35, -r * 0.8,
                0, -r
            );
            ctx.bezierCurveTo(
                -petalWidth * 0.35, -r * 0.8,
                -petalWidth * 0.55, -r * 0.35,
                0, 0
            );
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawCenter(cx, cy) {
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            const count = Math.floor(60 + bloom * 50);

            for (let i = 0; i < count; i++) {
                const r = Math.sqrt(i) * (canvas.width * 0.0075) * bloom;
                const theta = i * goldenAngle;
                const x = cx + Math.cos(theta) * r;
                const y = cy + Math.sin(theta) * r;
                const size = (2.5 + (i % 4)) * (canvas.width / 700);

                ctx.beginPath();
                ctx.fillStyle = `hsl(${35 + (i % 20)}, 75%, ${42 + (i % 8)}%)`;
                ctx.arc(x, y, size * bloom, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawFlower() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // Background fade
            ctx.fillStyle = 'rgba(8, 4, 20, 0.3)';
            ctx.fillRect(0, 0, w, h);

            // Batang
            ctx.strokeStyle = '#2d5a27';
            ctx.lineWidth = w * 0.014;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx, cy + h * 0.06);
            ctx.quadraticCurveTo(cx - 8, cy + h * 0.22, cx, cy + h * 0.4);
            ctx.stroke();

            // Daun
            drawLeaf(cx - w * 0.09, cy + h * 0.2, -0.5, w * 0.11);
            drawLeaf(cx + w * 0.08, cy + h * 0.26, 0.45, w * 0.09);

            // Kelopak
            const layers = [
                { count: 13, radius: 0.36, width: 0.17 },
                { count: 10, radius: 0.26, width: 0.13 },
                { count: 8,  radius: 0.17, width: 0.1 },
                { count: 6,  radius: 0.09, width: 0.07 }
            ];

            layers.forEach((layer, i) => {
                const progress = Math.min(1, bloom * 1.4 - i * 0.18);
                if (progress <= 0) return;

                for (let p = 0; p < layer.count; p++) {
                    const angle = (p / layer.count) * Math.PI * 2;
                    drawPetal(cx, cy, angle, layer, progress, i);
                }
            });

            drawCenter(cx, cy);
        }

        function animate() {
            bloom = Math.min(1, bloom + 0.006);
            drawFlower();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
